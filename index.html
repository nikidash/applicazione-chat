<!DOCTYPE html>
<html lang="en-US">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Applicazione Chat</title>
    <script src="paho-mqtt.js" defer></script>
    <script src="script.js" defer></script>
</head>

<body>
    <h1>Chat</h1>

    <div>
        <form>
            <label for="broker">Broker</label><br>
            <input type="text" id="broker" name="broker" placeholder="Type your broker"></input><br>

            <label for="port">Port</label><br>
            <input type="text" id="port" name="port" placeholder="Type the port"><br>

            <label for="topic">Topic</label><br>
            <input type="text" id="topic" name="topic" placeholder="Type your topic"></input><br>

            <label for="client">Client</label><br>
            <input type="text" id="client" name="client" placeholder="Type your client"><br>

            <input type="button" value="Connect" onclick="connect()">
            <input type="button" value="Disconnect" onclick="disconnect()"><br><br>
            <p id="connectionStatus">Disconnected</p>
        </form>
    </div>

    <hr>

    <div>
        <form>
            <label for="message">Message</label><br>
            <input type="message" id="message" name="message" placeholder="Messaggio">
            <input type="button" value="Chat" onclick="send()"><br><br>

            <label for="chatbox">Chatbox</label><br>
            <textarea id="chatbox" name="chatbox" rows="20" cols="100" disabled></textarea><br>

            <input type="button" value="Clear chat history" onclick="clearChat()">

        </form>
    </div>

</body>

</html>
